<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>North Van 2026 Ballot Match</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F2F5F7; --surface:#FFFFFF; --ink:#13202B; --muted:#55666F; --line:#D3DCE2;
  --accent:#1F5F7A; --accent-ink:#FFFFFF; --soft:#E6EEF2; --warn:#8A5A00; --warnbg:#FFF3D6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1A22; --surface:#16252F; --ink:#E8EEF2; --muted:#9DADB8; --line:#2A3C48;
    --accent:#7DBAD3; --accent-ink:#0F1A22; --soft:#1E3240; --warn:#F2C770; --warnbg:#3A2F14;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1A22; --surface:#16252F; --ink:#E8EEF2; --muted:#9DADB8; --line:#2A3C48;
  --accent:#7DBAD3; --accent-ink:#0F1A22; --soft:#1E3240; --warn:#F2C770; --warnbg:#3A2F14;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
h1,h2,h3{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;line-height:1.2;margin:0 0 .5em;font-weight:600}
h1{font-size:clamp(1.9rem,5vw,2.8rem)}
h2{font-size:1.5rem}
h3{font-size:1.15rem}
p{margin:0 0 .9em}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 56px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px}
.muted{color:var(--muted)}
.small{font-size:.875rem}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:11px 18px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{justify-content:space-between}

/* progress */
.prog{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;margin:6px 0 22px}
.prog>i{display:block;height:100%;background:var(--accent);transition:width .25s}

/* options */
.opts{display:grid;gap:10px;margin:18px 0}
.opt{display:block;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:9px;padding:13px 15px;line-height:1.45}
.opt:hover{border-color:var(--accent)}
.opt.on{border-color:var(--accent);background:var(--soft);box-shadow:inset 4px 0 0 var(--accent)}
.opt.alt{border-style:dashed}
.axis{display:flex;justify-content:space-between;gap:12px;font-size:.8rem;color:var(--muted)}
textarea{width:100%;min-height:84px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--accent)}
.offpanel{border:1px dashed var(--accent);border-radius:9px;padding:14px;margin:-2px 0 14px;background:var(--surface)}

/* weights */
.wrow{display:grid;grid-template-columns:1fr;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 11px;font-size:.9rem}
.seg button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
@media(min-width:700px){.wrow{grid-template-columns:minmax(220px,1fr) auto;align-items:center}}

/* profile bars */
.pbar{display:grid;grid-template-columns:1fr;gap:4px;padding:10px 0;border-top:1px solid var(--line)}
.track{position:relative;height:8px;background:var(--soft);border-radius:4px;margin:8px 6px}
.track i{position:absolute;top:-5px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--accent);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--accent)}
.chip{display:inline-block;font-size:.75rem;border:1px solid var(--line);border-radius:99px;padding:1px 8px;color:var(--muted);margin-left:6px;vertical-align:middle}

/* matrix */
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:900px;font-variant-numeric:tabular-nums}
th,td{padding:0;text-align:center;border-bottom:1px solid var(--line)}
thead th{position:sticky;top:0;background:var(--surface);font-weight:600;font-size:.8rem;padding:10px 4px;vertical-align:bottom;z-index:2}
th.name,td.name{position:sticky;left:0;background:var(--surface);text-align:left;padding:8px 12px;min-width:170px;z-index:1;border-right:1px solid var(--line)}
thead th.name{z-index:3}
td.num{padding:8px 6px;min-width:64px}
td.cell{min-width:72px}
td.cell button{width:100%;height:100%;min-height:46px;border:0;font-weight:600;font-variant-numeric:tabular-nums;border-radius:0}
td.cell button small{display:block;font-weight:400;font-size:.65rem;opacity:.85;line-height:1}
td.cell.sel button{outline:3px solid var(--ink);outline-offset:-3px}
td.empty{color:var(--muted);background:repeating-linear-gradient(45deg,transparent 0 6px,var(--soft) 6px 7px)}
tr.limited td.name{opacity:.85}
.dim{opacity:.4}
.flag{display:inline-block;background:var(--warnbg);color:var(--warn);font-size:.7rem;border-radius:4px;padding:1px 6px;margin-left:6px}
.tabs{display:flex;gap:8px;margin:14px 0}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 16px;font-weight:600}
.tabs button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.detail{margin-top:14px;border-left:4px solid var(--accent)}
.legend{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:150px;height:10px;border-radius:5px;background:linear-gradient(90deg,rgb(233,201,168),rgb(238,240,236),rgb(46,125,116))}
details{margin:12px 0}
summary{cursor:pointer;font-weight:600}
.dbtoggle{display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.profile{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);display:grid;gap:4px}
.profile p{margin:0}
a{color:var(--accent)}
.flagline{background:var(--warnbg);color:var(--warn);border-radius:6px;padding:6px 10px;margin:8px 0}
select{font:inherit;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:6px 8px}
@media (prefers-reduced-motion:reduce){.prog>i{transition:none}}
</style>
</head>

<script id="core">
/* =========================================================
   CORE: pure scoring functions. No DOM, no app state.
   test/core.test.js loads this block and the data block.
   ========================================================= */
var CONF={H:1,M:0.7,L:0.4};
var CONF_LABEL={H:"high",M:"medium",L:"low"};
var LIMITED_EVIDENCE=0.4;
var DEALBREAKER_GAP=2;
var UNKNOWN_ALIGN=50;
var PRIORITY_LABELS=["Not a factor","Matters","Matters a lot","Top priority"];

function align(u,p){return 100*(1-Math.abs(u-p)/4);}

/* Resolves a source key ("nsqa", "ch:Don-Bell") or raw URL to {t,u}. Null if unknown. */
function srcLink(k){
  if(/^https?:\/\//.test(k))return {t:k.replace(/^https?:\/\/(www\.)?/,"").replace(/\/$/,""),u:k};
  if(SRC[k])return SRC[k];
  var i=k.indexOf(":"),p=i>0&&SRC_PATTERNS[k.slice(0,i)];
  return p?{t:p.t,u:p.u.replace("$",k.slice(i+1))}:null;
}

/* Expected alignment with a position drawn uniformly from 1 to 5.
   E|u-X| = ((u-1)^2 + (5-u)^2) / 8, so this is 50 at the poles and 75 at the centre. */
function blindAlign(u){return 100*(1-((u-1)*(u-1)+(5-u)*(5-u))/32);}

function userScores(cats,questions,ans){
  var out={};
  cats.forEach(function(c){
    var v=questions.filter(function(q){return q.cat===c.id&&ans[q.id]&&ans[q.id].score!=null;}).map(function(q){return ans[q.id].score;});
    out[c.id]=v.length?v.reduce(function(a,b){return a+b;},0)/v.length:null;
  });
  return out;
}

/* Each area scores as a mix: the coded position counts with weight equal to its
   confidence, and the remainder (all of it when uncoded) counts as unknown.
   Every candidate is averaged over the same areas, so scores compare across
   candidates and thin evidence pulls a score toward the unknown value.
   Unknown defaults to UNKNOWN_ALIGN rather than blindAlign(u): for a centrist,
   blindAlign is 75, which would rank a blank candidate level with a well-documented
   one a full point away. Pass blindAlign as `unknown` for the expected score. */
function scoreCandidate(cand,us,w,db,cats,unknown){
  var num=0,wSum=0,ev=0,cells={},conflicts=[],unk=unknown||function(){return UNKNOWN_ALIGN;};
  cats.forEach(function(c){
    var u=us[c.id],d=cand.c[c.id],wt=w[c.id]||0;
    if(d)cells[c.id]={pos:d[0],conf:d[1],note:d[2],a:u==null?null:align(u,d[0])};
    if(u==null)return;
    if(db&&db[c.id]&&d&&d[1]!=="L"&&Math.abs(u-d[0])>=DEALBREAKER_GAP)conflicts.push(c.id);
    if(wt<=0)return;
    var e=d?CONF[d[1]]:0;
    num+=wt*((d?e*align(u,d[0]):0)+(1-e)*unk(u));
    wSum+=wt;ev+=wt*e;
  });
  var evidence=wSum?ev/wSum:0;
  return {score:wSum?num/wSum:null,evidence:evidence,limited:evidence<LIMITED_EVIDENCE,cells:cells,conflicts:conflicts};
}

function byScore(a,b){
  var sa=a.r.score==null?-1:a.r.score,sb=b.r.score==null?-1:b.r.score;
  return (sb-sa)||(b.r.evidence-a.r.evidence)||a.c.n.localeCompare(b.c.n);
}

function rankCandidates(cands,us,w,db,cats){
  return cands.map(function(c){return {c:c,r:scoreCandidate(c,us,w,db,cats)};}).sort(byScore);
}

function rng(seed){
  var a=seed>>>0;
  return function(){
    a=(a+0x6D2B79F5)>>>0;var t=a;
    t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);
    return ((t^(t>>>14))>>>0)/4294967296;
  };
}

/* One draw: each coded position is right with probability equal to its confidence,
   otherwise uniform on 1 to 5. The mean of many draws converges to
   scoreCandidate(..., blindAlign).score, not the more cautious default score. */
function sampleScore(cand,us,w,cats,rand){
  var num=0,wSum=0;
  cats.forEach(function(c){
    var u=us[c.id],wt=w[c.id]||0;
    if(u==null||wt<=0)return;
    var d=cand.c[c.id],e=d?CONF[d[1]]:0;
    var pos=rand()<e?d[0]:1+4*rand();
    num+=wt*align(u,pos);wSum+=wt;
  });
  return wSum?num/wSum:null;
}

/* Share of simulated runs in which each candidate lands in the top `slots`. */
function topChance(cands,us,w,cats,slots,runs,seed){
  var hits={},rand=rng(seed==null?1:seed),n=runs||2000,done=0;
  cands.forEach(function(c){hits[c.id]=0;});
  for(var i=0;i<n;i++){
    var s=cands.map(function(c){return {id:c.id,s:sampleScore(c,us,w,cats,rand)};}).filter(function(x){return x.s!=null;});
    if(!s.length)break;
    s.sort(function(a,b){return b.s-a.s;});
    s.slice(0,slots).forEach(function(x){hits[x.id]++;});
    done++;
  }
  Object.keys(hits).forEach(function(k){hits[k]=done?hits[k]/done:0;});
  return hits;
}

function hashStr(s){
  var h=2166136261;
  for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}
  return h>>>0;
}

/* Stable per-question shuffle so the answer list doesn't read as a 1-to-5 scale. */
function optionOrder(q){
  var idx=q.o.map(function(_,i){return i;}),rand=rng(hashStr(q.id));
  for(var i=idx.length-1;i>0;i--){var j=Math.floor(rand()*(i+1)),t=idx[i];idx[i]=idx[j];idx[j]=t;}
  var sc=idx.map(function(i){return q.o[i][1];}),up=true,down=true;
  for(var k=1;k<sc.length;k++){if(sc[k]<=sc[k-1])up=false;if(sc[k]>=sc[k-1])down=false;}
  if(up||down)idx.push(idx.shift());
  return idx;
}

/* Rebuilds saved or imported state from known ids only. Option scores come from
   the question data, never from the payload. Returns null if unusable. */
function sanitizeState(raw,cats,questions){
  if(!raw||typeof raw!=="object"||!raw.ans||typeof raw.ans!=="object")return null;
  var ans={},w={},db={};
  questions.forEach(function(q){
    var a=raw.ans[q.id];
    if(!a||typeof a!=="object")return;
    if(a.type==="opt"&&Number.isInteger(a.idx)&&a.idx>=0&&a.idx<q.o.length){
      ans[q.id]={type:"opt",idx:a.idx,score:q.o[a.idx][1]};
    }else if(a.type==="off"){
      var v=Number(a.score);
      if(isFinite(v))ans[q.id]={type:"off",score:Math.min(5,Math.max(1,Math.round(v*2)/2)),text:typeof a.text==="string"?a.text.slice(0,2000):""};
    }else if(a.type==="skip"){
      ans[q.id]={type:"skip",score:null};
    }
  });
  cats.forEach(function(c){
    var v=raw.w&&raw.w[c.id];
    w[c.id]=Number.isInteger(v)&&v>=0&&v<=3?v:1;
    if(raw.db&&raw.db[c.id]===true)db[c.id]=true;
  });
  return {ans:ans,w:w,db:db};
}
</script>

<script>
/* =========================================================
   APP: state, actions, views
   ========================================================= */
var KEY="nv2026-ballot-match-v1";
var RUNS=2000;
var CLOSE_CALL=3;
var S={step:"intro",i:0,ans:{},w:{},db:{},detail:null,tab:"mayor",sort:"match",offOpen:false,msg:""};
CATS.forEach(function(c){S.w[c.id]=1;});

function el(id){return document.getElementById(id);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});}
function cat(id){return CATS.filter(function(c){return c.id===id;})[0];}
function cand(id){return CANDS.filter(function(c){return c.id===id;})[0];}
function answeredCount(){return QUESTIONS.filter(function(q){return S.ans[q.id]&&S.ans[q.id].score!=null;}).length;}
function seats(g){return g==="mayor"?1:6;}
function apply(st){S.ans=st.ans;S.w=st.w;S.db=st.db;}

function load(){
  try{
    var o=JSON.parse(localStorage.getItem(KEY)||"null"),st=sanitizeState(o,CATS,QUESTIONS);
    if(!st)return;
    apply(st);
    if(["intro","q","w","res"].indexOf(o.step)>=0)S.step=o.step;
    if(Number.isInteger(o.i)&&o.i>=0&&o.i<QUESTIONS.length)S.i=o.i;
  }catch(e){}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify({ans:S.ans,w:S.w,db:S.db,step:S.step,i:S.i}));}catch(e){}}

/* Simulation is the slow part; cache it per answer/priority state. */
var chanceCache={key:null,val:null};
function chances(us){
  var key=JSON.stringify([us,S.w,S.db]);
  if(chanceCache.key===key)return chanceCache.val;
  var val={};
  ["mayor","council"].forEach(function(g){
    var pool=CANDS.filter(function(c){return c.g===g&&!scoreCandidate(c,us,S.w,S.db,CATS).conflicts.length;});
    val[g]=topChance(pool,us,S.w,CATS,seats(g),RUNS,7);
  });
  chanceCache={key:key,val:val};
  return val;
}

function results(us){
  var ch=chances(us),out={};
  ["mayor","council"].forEach(function(g){
    var rows=rankCandidates(CANDS.filter(function(c){return c.g===g;}),us,S.w,S.db,CATS);
    rows.forEach(function(x){x.chance=x.r.conflicts.length?0:(ch[g][x.c.id]||0);});
    var eligible=rows.filter(function(x){return x.r.score!=null&&!x.r.conflicts.length;});
    var n=seats(g),picks=eligible.slice(0,n),next=eligible[n];
    var close=!!(next&&picks.length===n&&picks[n-1].r.score-next.r.score<CLOSE_CALL);
    out[g]={rows:rows,picks:picks,next:next,close:close,excluded:rows.length-eligible.length};
  });
  return out;
}

function heat(p){
  var LOW=[233,201,168],MID=[238,240,236],HIGH=[46,125,116];
  function mix(a,b,t){return a.map(function(v,i){return Math.round(v+(b[i]-v)*t);});}
  var t=Math.max(0,Math.min(1,(p-30)/70)),rgb=t<0.5?mix(LOW,MID,t/0.5):mix(MID,HIGH,(t-0.5)/0.5);
  var lum=0.299*rgb[0]+0.587*rgb[1]+0.114*rgb[2];
  return {bg:"rgb("+rgb.join(",")+")",fg:lum<140?"#fff":"#13202B"};
}
function pct(x){return Math.round(x*100)+"%";}
function sourcesHtml(keys){
  var links=(keys||[]).map(srcLink).filter(Boolean);
  if(!links.length)return '';
  return '<p class="small">Sources: '+links.map(function(s){return '<a href="'+esc(s.u)+'" target="_blank" rel="noopener noreferrer">'+esc(s.t)+'</a>';}).join(' &middot; ')+'</p>';
}

/* =========================================================
   NAVIGATION + ACTIONS
   ========================================================= */
function go(step,i){
  S.step=step;if(typeof i==="number")S.i=i;
  var a=step==="q"&&S.ans[QUESTIONS[S.i].id];
  S.offOpen=!!(a&&a.type==="off");S.msg="";
  save();render();window.scrollTo(0,0);
}
function startNew(){S.ans={};S.db={};CATS.forEach(function(c){S.w[c.id]=1;});S.detail=null;go("q",0);}
function pick(idx){var q=QUESTIONS[S.i];S.ans[q.id]={type:"opt",idx:idx,score:q.o[idx][1]};S.offOpen=false;save();render();}
function skipQ(){var q=QUESTIONS[S.i];S.ans[q.id]={type:"skip",score:null};save();next();}
function toggleOff(){S.offOpen=!S.offOpen;render();}
function offInput(){
  var q=QUESTIONS[S.i],v=parseFloat(el("offrange").value);
  el("offval").textContent=v.toFixed(1);
  S.ans[q.id]={type:"off",score:v,text:el("offtxt").value};
  save();
  Array.prototype.forEach.call(document.querySelectorAll(".opt"),function(b){
    var on=b.classList.contains("alt");b.classList.toggle("on",on);b.setAttribute("aria-pressed",on?"true":"false");
  });
  el("nextbtn").disabled=false;
  el("offstatus").textContent="Saved as "+v.toFixed(1)+" / 5.";
}
function next(){if(S.i<QUESTIONS.length-1)go("q",S.i+1);else go("w");}
function back(){if(S.i>0)go("q",S.i-1);else go("intro");}
function setW(id,v){S.w[id]=v;save();render();}
function setDb(id,on){if(on)S.db[id]=true;else delete S.db[id];save();render();}
function setTab(t){S.tab=t;S.detail=null;render();}
function setSort(v){S.sort=v;render();}
function showDetail(cid,k){S.detail={c:cid,k:k};render();}
function importData(){
  var st=null;
  try{st=sanitizeState(JSON.parse(el("imp").value),CATS,QUESTIONS);}catch(e){}
  if(!st){S.msg="That didn't look like exported results. Paste the JSON block from the Export box.";render();return;}
  apply(st);S.detail=null;go("res");
  S.msg="Imported "+answeredCount()+" answers.";render();
}
function copyBox(id){
  var box=el(id),msg=el(id+"msg");
  function done(ok){if(msg)msg.textContent=ok?"Copied.":"Select the text and copy it manually.";}
  function legacy(){box.select();try{return document.execCommand("copy");}catch(e){return false;}}
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(box.value).then(function(){done(true);},function(){done(legacy());});
  else done(legacy());
}

/* =========================================================
   VIEWS
   ========================================================= */
var HOW='<p class="small">In each area, alignment = 100 &times; (1 &minus; |your position &minus; their position| &divide; 4).</p>'+
  '<p class="small">A coded position counts in proportion to its confidence: high 100%, medium 70%, low 40%. The rest of that area, and all of any area with no coded position, counts as unknown and scores '+UNKNOWN_ALIGN+'%, a coin flip. Areas are then averaged by your priorities. Thin or vague evidence therefore pulls a candidate toward '+UNKNOWN_ALIGN+'% instead of letting a few soft codings carry them to the top.</p>'+
  '<p class="small"><strong>Evidence</strong> is how much of the score rests on actual codings. Candidates under '+pct(LIMITED_EVIDENCE)+' are flagged "limited data".</p>'+
  '<p class="small"><strong>Top chance</strong> re-runs the scoring '+RUNS.toLocaleString()+' times. Each run treats every coding as wrong with a probability set by its confidence, and places wrong or missing positions at random on the scale. It counts how often the candidate makes your top 1 (mayor) or top 6 (council). A thinly documented candidate can show a real Top chance with a modest Match: they might fit you well, but the record doesn\'t show it.</p>'+
  '<p class="small">A <strong>dealbreaker</strong> area flags any candidate whose medium or high confidence position is '+DEALBREAKER_GAP+' or more points from yours, and leaves them out of your top picks.</p>'+
  '<p class="small">This is not an endorsement. Coding is a judgment call on limited, mostly self-reported information, and every cell shows its evidence so you can disagree with it.</p>';

function introView(){
  var n=answeredCount();
  return '<h1>North Van 2026 Ballot Match</h1>'+
  '<p class="muted">City of North Vancouver, general local election, Saturday October 17, 2026. One mayor, up to six councillors.</p>'+
  '<p class="small muted">Voting day is 8 a.m. to 8 p.m. at nine locations. Mail ballots must reach the City by 8 p.m. that day. <a href="https://www.cnv.org/City-Hall/General-Local-Election/2026-General-Local-Election" target="_blank" rel="noopener noreferrer">Locations and details on cnv.org</a>.</p>'+
  '<div class="card">'+
  '<p>Answer '+QUESTIONS.length+' short scenario questions across '+CATS.length+' policy areas. Each has four set answers plus an <strong>off-script</strong> option where you write your own view and place it on the scale. Then rate how much each area matters to you.</p>'+
  '<p>Your answers become a position (1 to 5) in each area. Each candidate was coded on the same scales from public statements, campaign sites and reported votes. The results matrix shows how closely they line up, area by area.</p>'+
  '<div class="row">'+
  (n?'<button class="btn" onclick="go(\'res\')">See my results</button><button class="btn ghost" onclick="go(\'q\',0)">Edit my answers</button><button class="btn ghost" onclick="startNew()">Start over</button>':'<button class="btn" onclick="startNew()">Start the interview</button>')+
  '</div></div>'+
  '<details class="card"><summary>How scoring works</summary>'+HOW+'</details>'+
  '<details class="card"'+(S.msg?' open':'')+'><summary>Import saved results</summary>'+
  '<p class="small">Paste the JSON from a previous export to restore your answers.</p>'+
  '<textarea id="imp" aria-label="Saved results JSON"></textarea>'+
  '<div class="row" style="margin-top:8px"><button class="btn ghost" onclick="importData()">Import</button><span class="small muted" role="status">'+esc(S.msg)+'</span></div></details>';
}

function qView(){
  var q=QUESTIONS[S.i],c=cat(q.cat),a=S.ans[q.id],isOff=a&&a.type==="off";
  var h='<div class="row spread small muted"><span>'+esc(c.name)+'</span><span>Question '+(S.i+1)+' of '+QUESTIONS.length+'</span></div>'+
  '<div class="prog"><i style="width:'+Math.round(S.i/QUESTIONS.length*100)+'%"></i></div>'+
  '<div class="card"><h2>'+esc(q.q)+'</h2><div class="opts" role="group" aria-label="Answer choices">';
  optionOrder(q).forEach(function(idx){
    var on=a&&a.type==="opt"&&a.idx===idx;
    h+='<button class="opt'+(on?' on':'')+'" aria-pressed="'+(on?'true':'false')+'" onclick="pick('+idx+')">'+esc(q.o[idx][0])+'</button>';
  });
  h+='<button class="opt alt'+(isOff?' on':'')+'" aria-pressed="'+(isOff?'true':'false')+'" aria-expanded="'+(S.offOpen?'true':'false')+'" onclick="toggleOff()">Off-script: none of these fit. I\'ll say it myself.</button></div>';
  if(S.offOpen){
    var val=isOff?a.score:3,txt=isOff&&a.text?a.text:"";
    h+='<div class="offpanel"><label for="offtxt"><strong>Your view</strong></label>'+
    '<textarea id="offtxt" oninput="offInput()" placeholder="Say it in your own words. This is saved with your results.">'+esc(txt)+'</textarea>'+
    '<p style="margin:12px 0 4px"><strong>Where does it sit on this scale?</strong> <span id="offval">'+Number(val).toFixed(1)+'</span></p>'+
    '<input id="offrange" type="range" min="1" max="5" step="0.5" value="'+val+'" oninput="offInput()" aria-label="Position on scale from 1 to 5">'+
    '<div class="axis"><span>1: '+esc(c.lo)+'</span><span style="text-align:right">5: '+esc(c.hi)+'</span></div>'+
    '<p class="small muted" id="offstatus" role="status" style="margin:10px 0 0">'+(isOff?'Saved as '+Number(val).toFixed(1)+' / 5.':'Only the slider position is scored. Your answer saves as you type or move the slider.')+'</p></div>';
  }
  h+='<div class="row spread"><button class="btn ghost" onclick="back()">Back</button><div class="row"><button class="btn ghost" onclick="skipQ()">Skip</button><button class="btn" id="nextbtn" '+(a?'':'disabled')+' onclick="next()">'+(S.i===QUESTIONS.length-1?'Continue':'Next')+'</button></div></div></div>';
  return h;
}

function wView(){
  var h='<div class="row spread small muted"><span>Last step</span><span>Priorities</span></div><div class="prog"><i style="width:100%"></i></div>'+
  '<div class="card"><h2>How much does each area matter to you?</h2><p class="muted">Areas set to "Not a factor" are left out of the match score. Mark an area as a <strong>dealbreaker</strong> to flag candidates who sit '+DEALBREAKER_GAP+'+ points away from you on it and leave them out of your top picks.</p>';
  CATS.forEach(function(c){
    h+='<div class="wrow"><div><strong>'+esc(c.name)+'</strong><div class="small muted">'+esc(c.lo)+' &harr; '+esc(c.hi)+'</div></div><div class="row"><div class="seg" role="group" aria-label="Priority for '+esc(c.name)+'">';
    PRIORITY_LABELS.forEach(function(l,v){h+='<button class="'+(S.w[c.id]===v?'on':'')+'" aria-pressed="'+(S.w[c.id]===v)+'" onclick="setW(\''+c.id+'\','+v+')">'+l+'</button>';});
    h+='</div><label class="small dbtoggle"><input type="checkbox" '+(S.db[c.id]?'checked ':'')+'onchange="setDb(\''+c.id+'\',this.checked)"> Dealbreaker</label></div></div>';
  });
  h+='<div class="row spread" style="margin-top:16px"><button class="btn ghost" onclick="go(\'q\','+(QUESTIONS.length-1)+')">Back</button><button class="btn" onclick="go(\'res\')">Show my matrix</button></div></div>';
  return h;
}

function picksLine(res,g){
  var R=res[g];
  if(!R.picks.length)return 'not enough answers yet';
  return R.picks.map(function(x){return esc(x.c.n)+' ('+Math.round(x.r.score)+'%'+(x.r.limited?', limited data':'')+')';}).join(', ');
}

function resView(){
  var us=userScores(CATS,QUESTIONS,S.ans),res=results(us),R=res[S.tab],n=seats(S.tab);
  var h='<h1>Your results</h1><p class="muted">Match is how closely a candidate\'s stated positions line up with yours. It is not a recommendation.</p>';
  if(S.msg)h+='<p class="small" role="status">'+esc(S.msg)+'</p>';
  h+='<div class="row" style="margin-bottom:12px"><button class="btn ghost" onclick="go(\'q\',0)">Edit answers</button><button class="btn ghost" onclick="go(\'w\')">Change priorities</button><button class="btn ghost" onclick="startNew()">Start over</button></div>';

  /* profile */
  h+='<div class="card"><h2>Where you landed</h2>';
  CATS.forEach(function(c){
    var u=us[c.id];
    h+='<div class="pbar"><div><strong>'+esc(c.name)+'</strong><span class="chip">'+PRIORITY_LABELS[S.w[c.id]||0]+'</span>'+(S.db[c.id]?'<span class="chip">dealbreaker</span>':'')+'</div>';
    if(u==null){h+='<div class="small muted">No answer given</div></div>';return;}
    h+='<div class="track" aria-hidden="true"><i style="left:'+((u-1)/4*100)+'%"></i></div>'+
    '<div class="axis"><span>'+esc(c.lo)+'</span><span>'+u.toFixed(1)+' / 5</span><span style="text-align:right">'+esc(c.hi)+'</span></div></div>';
  });
  h+='</div>';

  /* matrix */
  var rows=R.rows.slice();
  if(S.sort==="name")rows.sort(function(a,b){return a.c.n.localeCompare(b.c.n);});
  else if(S.sort==="ev")rows.sort(function(a,b){return b.r.evidence-a.r.evidence;});
  var mayors=CANDS.filter(function(c){return c.g==="mayor";}).length,councils=CANDS.length-mayors;

  h+='<h2 style="margin-top:26px">Candidate matrix</h2>';
  h+='<div class="row spread"><div class="tabs" role="tablist"><button role="tab" aria-selected="'+(S.tab==="mayor")+'" class="'+(S.tab==="mayor"?'on':'')+'" onclick="setTab(\'mayor\')">Mayor ('+mayors+')</button><button role="tab" aria-selected="'+(S.tab==="council")+'" class="'+(S.tab==="council"?'on':'')+'" onclick="setTab(\'council\')">Council ('+councils+')</button></div>'+
  '<label class="small">Sort <select onchange="setSort(this.value)"><option value="match"'+(S.sort==="match"?" selected":"")+'>Best match</option><option value="ev"'+(S.sort==="ev"?" selected":"")+'>Most evidence</option><option value="name"'+(S.sort==="name"?" selected":"")+'>Name</option></select></label></div>';
  h+='<div class="card" style="margin-bottom:12px"><strong>'+(S.tab==="mayor"?'Closest match for mayor: ':'Closest six for council: ')+'</strong>'+picksLine(res,S.tab);
  if(R.close)h+='<div class="small flagline">Close call: '+esc(R.picks[n-1].c.n)+' ('+Math.round(R.picks[n-1].r.score)+'%) and '+esc(R.next.c.n)+' ('+Math.round(R.next.r.score)+'%) are within '+CLOSE_CALL+' points. Check the Top chance column and the evidence before deciding.</div>';
  if(R.excluded)h+='<div class="small muted">'+R.excluded+' candidate'+(R.excluded>1?'s':'')+' left out by your dealbreakers or for lack of answers.</div>';
  h+='<div class="small muted">Limited-data candidates are scored mostly as unknowns, so their match sits near '+UNKNOWN_ALIGN+'%.</div></div>';
  h+='<div class="legend" style="margin-bottom:8px"><span>Low alignment</span><i></i><span>High alignment</span><span>&nbsp;&nbsp;H / M / L under each cell = confidence in the coding. Hatched = no stated position found.</span></div>';

  h+='<div class="scroll"><table><thead><tr><th class="name">Candidate</th><th title="Confidence-weighted match across your priorities">Match</th><th title="How much of the match rests on coded positions rather than unknowns">Evidence</th><th title="Share of '+RUNS+' simulations, with codings varied by confidence, where this candidate makes your top '+n+'">Top '+n+' chance</th>';
  CATS.forEach(function(c){h+='<th title="'+esc(c.name)+'" class="'+((S.w[c.id]||0)===0?'dim':'')+'">'+esc(c.short)+'</th>';});
  h+='</tr></thead><tbody>';
  rows.forEach(function(x){
    var m=x.r.score==null?null:heat(x.r.score),cf=x.r.conflicts;
    h+='<tr class="'+(x.r.limited?'limited':'')+'"><td class="name"><strong>'+esc(x.c.n)+'</strong>'+(x.c.inc?'<span class="chip">incumbent</span>':'')+(x.r.limited?'<span class="flag">limited data</span>':'')+
    (cf.length?'<span class="flag" title="Dealbreaker conflict">conflicts: '+esc(cf.map(function(k){return cat(k).short;}).join(', '))+'</span>':'')+'</td>'+
    '<td class="num" style="'+(m?'background:'+m.bg+';color:'+m.fg+';':'')+'font-weight:700">'+(x.r.score==null?'&ndash;':Math.round(x.r.score)+'%')+'</td>'+
    '<td class="num muted">'+pct(x.r.evidence)+'</td>'+
    '<td class="num muted">'+(x.r.score==null||cf.length?'&ndash;':pct(x.chance))+'</td>';
    CATS.forEach(function(c){
      var cell=x.r.cells[c.id],sel=S.detail&&S.detail.c===x.c.id&&S.detail.k===c.id,dim=(S.w[c.id]||0)===0?' dim':'';
      if(!cell||cell.a==null){h+='<td class="cell empty'+dim+'">'+(cell?'<button style="background:transparent;color:inherit" onclick="showDetail(\''+x.c.id+'\',\''+c.id+'\')" aria-label="'+esc(x.c.n+', '+c.name+': no answer from you')+'">&ndash;</button>':'&ndash;')+'</td>';return;}
      var hc=heat(cell.a);
      h+='<td class="cell'+(sel?' sel':'')+dim+'"><button style="background:'+hc.bg+';color:'+hc.fg+'" onclick="showDetail(\''+x.c.id+'\',\''+c.id+'\')" aria-label="'+esc(x.c.n+', '+c.name+': '+Math.round(cell.a)+' percent alignment, '+CONF_LABEL[cell.conf]+' confidence')+'">'+Math.round(cell.a)+'<small>'+cell.conf+'</small></button></td>';
    });
    h+='</tr>';
  });
  h+='</tbody></table></div>';

  /* detail */
  if(S.detail){
    var cd=cand(S.detail.c),ct=cat(S.detail.k),d=cd.c[ct.id],u=us[ct.id];
    h+='<div class="card detail"><h3>'+esc(cd.n)+' on '+esc(ct.name)+'</h3>';
    if(d){
      var e=CONF[d[1]];
      h+='<p><strong>Their position: '+d[0]+' / 5</strong> ('+CONF_LABEL[d[1]]+' confidence)<br>'+(u!=null?'<strong>Your position: '+u.toFixed(1)+' / 5</strong><br><strong>Alignment: '+Math.round(align(u,d[0]))+'%</strong>':'<span class="muted">You gave no answer in this area.</span>')+'</p>'+
      '<p>Evidence: '+esc(d[2])+'</p>'+sourcesHtml(d[3])+
      (u!=null?'<p class="small muted">This coding carries '+pct(e)+' of the weight in this area. The other '+pct(1-e)+' treats their position as unknown ('+UNKNOWN_ALIGN+'%), so this area contributes '+Math.round(e*align(u,d[0])+(1-e)*UNKNOWN_ALIGN)+'% to their match.</p>':'');
    }else h+='<p>No stated position found for this candidate in this area.</p>';
    h+='<div class="axis"><span>1: '+esc(ct.lo)+'</span><span style="text-align:right">5: '+esc(ct.hi)+'</span></div>';
    h+='<div class="profile small"><strong>About '+esc(cd.n)+'</strong>'+(cd.inc?' (incumbent)':'')+
      '<div>Endorsed by: '+(cd.e&&cd.e.length?esc(cd.e.join(', ')):'no organisational endorsements found')+'</div>'+
      (cd.x?'<div>'+esc(cd.x)+'</div>'+(cd.xs?sourcesHtml(cd.xs):''):'')+'</div></div>';
  }

  /* export */
  h+='<details class="card" style="margin-top:18px"><summary>Export results</summary>'+
  '<p class="small muted">Paste this summary into a chat to talk through the results, or save the JSON to restore your answers later.</p>'+
  '<textarea id="sumbox" readonly aria-label="Results summary">'+esc(summaryText(us,res))+'</textarea>'+
  '<div class="row" style="margin:8px 0 14px"><button class="btn ghost" onclick="copyBox(\'sumbox\')">Copy summary</button><span id="sumboxmsg" class="small muted" role="status"></span></div>'+
  '<textarea id="jsonbox" readonly aria-label="Results JSON">'+esc(JSON.stringify({ans:S.ans,w:S.w,db:S.db}))+'</textarea>'+
  '<div class="row" style="margin-top:8px"><button class="btn ghost" onclick="copyBox(\'jsonbox\')">Copy JSON</button><span id="jsonboxmsg" class="small muted" role="status"></span></div></details>';
  h+='<details class="card"><summary>How scoring works</summary>'+HOW+'</details>';
  h+='<p class="small muted">Candidate coding is based on public information gathered October 10 to 15, 2026: recorded council votes (Council Record, checked against City minutes), the North Shore News candidate Q&amp;A and forum reports, North Vancouver Chamber of Commerce Q&amp;As, North Van Votes, Vote4Tomorrow, VoteMate, HUB Cycling\'s survey, campaign websites and endorsement lists. Each coded cell links its sources. Campaign statements are self-reported. Facebook and Instagram were not read.</p>';
  return h;
}

function summaryText(us,res){
  var sum="North Van 2026 ballot match, my results\n";
  CATS.forEach(function(c){
    var u=us[c.id];
    sum+="- "+c.name+": "+(u==null?"no answer":u.toFixed(1)+"/5 ("+c.lo+" = 1, "+c.hi+" = 5)")+"; priority "+PRIORITY_LABELS[S.w[c.id]||0].toLowerCase()+(S.db[c.id]?"; dealbreaker":"")+"\n";
  });
  var offs=QUESTIONS.filter(function(q){return S.ans[q.id]&&S.ans[q.id].type==="off"&&S.ans[q.id].text;});
  if(offs.length){sum+="\nOff-script answers:\n";offs.forEach(function(q){sum+="- "+q.q+" -> "+S.ans[q.id].text+" (placed at "+S.ans[q.id].score+"/5)\n";});}
  [["mayor","Mayor"],["council","Council"]].forEach(function(g){
    var n=seats(g[0]);
    sum+="\n"+g[1]+" (match, evidence, top-"+n+" chance):\n";
    res[g[0]].rows.filter(function(x){return x.r.score!=null;}).forEach(function(x){
      sum+="- "+x.c.n+" "+Math.round(x.r.score)+"%, evidence "+pct(x.r.evidence)+(x.r.conflicts.length?", dealbreaker conflict on "+x.r.conflicts.map(function(k){return cat(k).short;}).join("/"):", top-"+n+" chance "+pct(x.chance))+(x.r.limited?" (limited data)":"")+"\n";
    });
  });
  return sum;
}

function render(){
  var h;
  if(S.step==="q")h=qView();else if(S.step==="w")h=wView();else if(S.step==="res")h=resView();else h=introView();
  el("app").innerHTML=h;
}
load();
if(S.step==="q"){var a0=S.ans[QUESTIONS[S.i].id];S.offOpen=!!(a0&&a0.type==="off");}
render();
</script>
</body>
</html>
